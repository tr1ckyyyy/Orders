<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Заказы Spend Buy</title><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Заказы">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: summary tiles, then a sticky search + status chips, then a feed of order cards (1 column on phone, 2-3 on desktop). Add button is docked at the bottom; add/edit opens as a bottom sheet. */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --surface2:#e8ebf0; --line:#d6dbe3;
  --fg:#12161c; --muted:#586270;
  --accent:#2748d8; --on-accent:#ffffff;
  --warn-bg:#ffeccb; --warn-fg:#7a4300;
  --info-bg:#e3e9ff; --info-fg:#1f3aa8;
  --ok-bg:#d9f2e3; --ok-fg:#0c6636;
  --bad-bg:#fde0e0; --bad-fg:#9c1b1b;
  --org-bg:#ffdcb8; --org-fg:#8a3a00;
  --scrim:rgba(10,14,20,.45);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1217; --surface:#181c23; --surface2:#222835; --line:#2d3543;
    --fg:#e9edf3; --muted:#9aa5b5;
    --accent:#8aa0ff; --on-accent:#0b1030;
    --warn-bg:#3b2b0d; --warn-fg:#ffcb70;
    --info-bg:#1f2750; --info-fg:#b0bdff;
    --ok-bg:#12301f; --ok-fg:#86dfae;
    --bad-bg:#3a1717; --bad-fg:#ff9d9d;
    --org-bg:#4a2608; --org-fg:#ffab5e;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1217; --surface:#181c23; --surface2:#222835; --line:#2d3543;
  --fg:#e9edf3; --muted:#9aa5b5;
  --accent:#8aa0ff; --on-accent:#0b1030;
  --warn-bg:#3b2b0d; --warn-fg:#ffcb70;
  --info-bg:#1f2750; --info-fg:#b0bdff;
  --ok-bg:#12301f; --ok-fg:#86dfae;
  --bad-bg:#3a1717; --bad-fg:#ff9d9d;
  --org-bg:#4a2608; --org-fg:#ffab5e;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--font); font-size:15px; line-height:1.4;
  padding-block:16px 104px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:26px;line-height:1.1;font-weight:600;text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{
  text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;
}
.tile .t-label{font-size:12px;color:var(--muted);font-weight:500}
.tile b{font-size:30px;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums}
.tile .t-sub{font-size:12px;color:var(--muted)}
.tile.alert{background:var(--bad-bg);border-color:transparent}
.tile.alert .t-label,.tile.alert .t-sub,.tile.alert b{color:var(--bad-fg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 4px;margin-top:8px}
.search{width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.note{margin:6px 0 0;font-size:13px;color:var(--muted)}
.banner{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn-fg);font-size:14px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.c-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.who{font-size:17px;font-weight:600;overflow-wrap:anywhere;min-width:0}
.pill{flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.info{background:var(--info-bg);color:var(--info-fg)}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.c-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0;font-size:14px}
.country{background:var(--surface2);border-radius:6px;padding:2px 8px;font-size:13px}
.link{color:var(--accent);text-decoration:none;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link:hover{text-decoration:underline}
.nolink{color:var(--muted);font-size:13px}
.c-track{display:flex;align-items:center;gap:8px;min-width:0}
.c-track code{font-family:var(--mono);font-size:13px;background:var(--surface2);border-radius:6px;padding:4px 8px;overflow-wrap:anywhere;user-select:all;min-width:0}
.c-track .copy{flex:none;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}
.c-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{
  height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);
  font-size:14px;font-weight:500;padding:0 8px;
}
.tog.on{background:var(--ok-bg);border-color:transparent;color:var(--ok-fg)}
.tog.off{background:var(--org-bg);border-color:transparent;color:var(--org-fg)}
.edit{grid-column:1/-1;height:38px;border:0;background:transparent;color:var(--muted);font-size:14px;border-radius:8px}
.edit:hover{background:var(--surface2)}
.empty{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:17px;margin-bottom:6px;font-weight:600}
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.dock .add{display:block;width:100%;max-width:1100px;margin:0 auto;height:52px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600}
.dock .add:disabled{opacity:.5}
.sheet-wrap{
  position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);overscroll-behavior:contain;
}
.sheet{
  width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);
  border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
}
@media (min-width:640px){.sheet-wrap{align-items:center}.sheet{border-radius:16px;padding-bottom:16px}}
.sheet h2{margin:0 0 12px;font-size:20px;font-weight:600}
.f{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl,.fld label{font-size:13px;color:var(--muted);font-weight:500}
.fld input,.fld select{
  width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;min-width:0;
}
.fld input.mono{font-family:var(--mono)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{grid-column:1/-1;background:transparent;border-color:var(--bad-fg);color:var(--bad-fg)}
.btn.danger.armed{background:var(--bad-bg)}
.btn:disabled{opacity:.5}
.backup{margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
.b-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;
  max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Без двойного тап-зума и подсветки нажатий */
html,body,button,a,input,select,.card,.chip,.tile{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.chip,.tile,.tog,.pill,.who{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{-webkit-text-size-adjust:100%}
/* Компактный вид для телефона */
body{font-size:14px;line-height:1.3;padding-block:10px 84px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
h1{font-size:20px}
.brand{font-size:11px}
.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.tile{padding:8px 10px;border-radius:10px;gap:0}
.tile .t-label{font-size:11px}
.tile b{font-size:22px}
.tile .t-sub{font-size:11px}
.bar{padding-block:6px 0;margin-top:4px}
.search{height:38px;font-size:16px;border-radius:9px;padding:0 12px}
.chips{gap:6px;padding-block:8px 2px}
.chip{height:30px;padding:0 10px;font-size:13px;gap:4px}
.note{font-size:12px;margin-top:4px}
.banner{margin-top:8px;padding:8px 10px;font-size:13px}
.list{grid-template-columns:1fr;gap:8px;margin-top:8px}
.card{padding:10px;gap:8px;border-radius:10px}
.who{font-size:15px}
.pill{font-size:11px;padding:2px 8px}
.c-meta{font-size:13px;gap:6px}
.country{font-size:12px;padding:1px 7px}
.c-track code{font-size:12px;padding:3px 7px}
.c-track .copy{height:28px;font-size:12px;padding:0 8px}
.c-foot{gap:6px}
.tog{height:38px;font-size:13px;border-radius:9px}
.edit{height:28px;font-size:13px}
.empty{padding:20px 14px;margin-top:8px}
.empty strong{font-size:15px}
.dock{padding-top:8px}
.dock .add{height:46px;font-size:16px;border-radius:10px}
.sheet{padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:17px;margin-bottom:8px}
.f{gap:9px}
.lbl,.fld label{font-size:12px}
.fld input,.fld select{height:40px;font-size:16px;border-radius:9px}
.seg button{height:40px;font-size:15px;border-radius:9px}
.btn{height:42px;font-size:15px;border-radius:9px}
.backup{margin-top:16px;padding-top:10px}
.toast{bottom:calc(70px + env(safe-area-inset-bottom,0px));font-size:13px}
</style>

<div class="app">
  <header class="top">
    <div class="brand">Spend Buy</div>
    <h1>Заказы</h1>
  </header>

  <section class="tiles" aria-label="Сводка">
    <button type="button" class="tile" id="tileWait">
      <span class="t-label">Ждёт выкупа</span>
      <b id="nWait">0</b>
      <span class="t-sub" id="subWait">загружаю…</span>
    </button>
    <button type="button" class="tile" id="tileDebt">
      <span class="t-label">Долг за доставку</span>
      <b id="sumDebt">0 ₽</b>
      <span class="t-sub" id="subDebt">загружаю…</span>
    </button>
  </section>

  <div class="bar">
    <input class="search" id="search" type="search" placeholder="Поиск: клиент, ссылка, трек" autocomplete="off" aria-label="Поиск по заказам">
    <div class="chips" id="chips" role="group" aria-label="Фильтр по статусу"></div>
  </div>
  <p class="note" id="note" hidden></p>
  <div class="banner" id="banner" hidden></div>

  <main class="list" id="list" aria-live="polite"></main>
  <div class="empty" id="empty"><strong>Загружаю заказы</strong>Секунду.</div>

  <footer class="backup">
    <div class="b-row">
      <button type="button" class="btn" id="exportBtn">Сохранить копию</button>
      <button type="button" class="btn" id="importBtn">Загрузить копию</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <p class="note" id="backupNote"></p>
  </footer>
</div>

<div class="dock"><button type="button" class="add" id="addBtn" disabled>＋ Новый заказ</button></div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Новый заказ</h2>
    <form class="f" id="form" novalidate>
      <div class="fld"><label for="fLink">Ссылка на вещь</label><input id="fLink" type="text" inputmode="url" autocomplete="off" placeholder="https://…"></div>
      <div class="fld"><label for="fClient">Юзернейм клиента</label><input id="fClient" type="text" autocomplete="off" autocapitalize="none" placeholder="@username"></div>
      <div class="two">
        <div class="fld"><label for="fCountry">Страна</label><select id="fCountry"></select></div>
        <div class="fld"><label for="fStatus">Статус</label><select id="fStatus"></select></div>
      </div>
      <div class="fld"><span class="lbl" id="lblBought">Выкупил</span>
        <div class="seg" id="seg-bought" role="group" aria-labelledby="lblBought"><button type="button" data-v="1" aria-pressed="false">Да</button><button type="button" data-v="0" aria-pressed="true">Нет</button></div>
      </div>
      <div class="fld"><label for="fTrack">Трек-номер</label><input id="fTrack" class="mono" type="text" autocomplete="off" autocapitalize="characters"></div>
      <div class="fld"><span class="lbl" id="lblShip">Доставка оплачена</span>
        <div class="seg" id="seg-shipPaid" role="group" aria-labelledby="lblShip"><button type="button" data-v="1" aria-pressed="false">Да</button><button type="button" data-v="0" aria-pressed="true">Нет</button></div>
      </div>
      <div class="fld"><label for="fShipCost">Стоимость доставки, ₽</label><input id="fShipCost" type="text" inputmode="decimal" autocomplete="off"></div>
      <div class="actions">
        <button type="button" class="btn" id="cancelBtn">Отмена</button>
        <button type="submit" class="btn primary" id="saveBtn">Сохранить</button>
        <button type="button" class="btn danger" id="delBtn" hidden>Удалить заказ</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  var WAIT = "Ждёт выкупа";
  var STATUSES = [WAIT, "Выкуплено", "Едет", "На складе", "Отправлено"];
  var COUNTRIES = ["США", "Европа", "Китай", "Япония", "Корея", "Другая"];
  var $ = function (id) { return document.getElementById(id); };

  var orders = [], filter = "all", query = "", loaded = false, store = null;
  var F = { id: null, bought: false, shipPaid: false };
  var chains = new Map();
  var toastTimer = null, delTimer = null, loadTimer = null;

  /* ---------- helpers ---------- */
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function fmt(n) { return Number(n || 0).toLocaleString("ru-RU"); }
  function plural(n) {
    var a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return "заказ";
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return "заказа";
    return "заказов";
  }
  function num(v) {
    if (v === null || v === undefined || v === "") return null;
    var n = parseFloat(String(v).replace(/\s/g, "").replace(",", "."));
    return isFinite(n) ? n : null;
  }
  function el(tag, attrs) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) continue;
      n.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return n;
  }
  function safeHref(s) {
    s = String(s || "").trim();
    if (!s) return null;
    var tries = [s, "https://" + s];
    for (var i = 0; i < tries.length; i++) {
      try {
        var u = new URL(tries[i]);
        if ((u.protocol === "http:" || u.protocol === "https:") && u.hostname.indexOf(".") > 0) return u;
      } catch (e) {}
    }
    return null;
  }
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3500);
  }
  function errText(e) {
    var c = e && e.code;
    if (c === "quota_exceeded") return "Хранилище заполнено. Удали старые заказы.";
    if (c === "invalid_argument") return "Не сохранилось: заказ мог быть удалён, либо нет прав на запись.";
    return "Не получилось сохранить. Попробуй ещё раз.";
  }
  function run(p) {
    return p.catch(function (e) { toast(errText(e)); throw e; });
  }
  function queued(id, fn) {
    var prev = chains.get(id) || Promise.resolve();
    var next = prev.catch(function () {}).then(fn);
    chains.set(id, next);
    next.catch(function () {}).then(function () { if (chains.get(id) === next) chains.delete(id); });
    return next;
  }
  function norm(o) {
    var sc = num(o.shipCost);
    return {
      id: o.id,
      link: String(o.link || ""),
      client: String(o.client || ""),
      country: String(o.country || ""),
      track: String(o.track || ""),
      status: String(o.status || WAIT),
      bought: !!o.bought,
      shipPaid: !!o.shipPaid,
      shipCost: sc,
      createdAt: Number(o.createdAt) || 0
    };
  }

  /* ---------- storage: shared db when available, this browser otherwise ---------- */
  function makeLocal() {
    var mem = [], subs = [];
    try { mem = JSON.parse(lsGet("sb_orders") || "[]"); } catch (e) { mem = []; }
    function emit() { lsSet("sb_orders", JSON.stringify(mem)); subs.forEach(function (f) { f(mem.slice(), false); }); }
    return {
      local: true,
      subscribe: function (cb) { subs.push(cb); cb(mem.slice(), false); return function () {}; },
      add: function (d) {
        var id = "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        mem.push(Object.assign({}, d, { id: id })); emit(); return Promise.resolve();
      },
      update: function (id, p) { mem = mem.map(function (o) { return o.id === id ? Object.assign({}, o, p) : o; }); emit(); return Promise.resolve(); },
      remove: function (id) { mem = mem.filter(function (o) { return o.id !== id; }); emit(); return Promise.resolve(); },
      addWithId: function (id, d) { mem.push(Object.assign({}, d, { id: id })); emit(); return Promise.resolve(); }
    };
  }
  function makeDb(db) {
    var col = db.collection("orders");
    return {
      local: false,
      subscribe: function (cb, err) {
        return col.onSnapshot(function (s) {
          cb(s.docs.map(function (d) { return Object.assign({}, d.data(), { id: d.id }); }), !!(s.metadata && s.metadata.fromCache));
        }, err);
      },
      add: function (d) { return col.add(d); },
      update: function (id, p) { return col.doc(id).update(p); },
      remove: function (id) { return col.doc(id).delete(); }
    };
  }

  /* ---------- derived data ---------- */
  function visible() {
    var s = query.trim().toLowerCase();
    var a = orders.filter(function (o) {
      if (filter === "debt") { if (!(o.bought && !o.shipPaid)) return false; }
      else if (filter !== "all" && o.status !== filter) return false;
      if (!s) return true;
      return [o.client, o.link, o.track, o.country].some(function (v) { return v.toLowerCase().indexOf(s) >= 0; });
    });
    a.sort(function (x, y) {
      var wx = !x.bought, wy = !y.bought;
      if (wx !== wy) return wx ? -1 : 1;
      return wx ? x.createdAt - y.createdAt : y.createdAt - x.createdAt;
    });
    return a;
  }

  /* ---------- render ---------- */
  function renderSummary() {
    var wait = orders.filter(function (o) { return !o.bought; }).length;
    var debt = orders.filter(function (o) { return o.bought && !o.shipPaid; });
    var sum = debt.reduce(function (s, o) { return s + (o.shipCost || 0); }, 0);
    $("nWait").textContent = String(wait);
    $("subWait").textContent = wait ? "оплачено, не заказано" : "всё выкуплено";
    $("tileWait").classList.toggle("alert", wait > 0);
    $("sumDebt").textContent = fmt(sum) + " ₽";
    $("subDebt").textContent = debt.length ? debt.length + " " + plural(debt.length) + " ждут оплаты" : "долгов нет";
  }
  function renderBar() {
    var debtN = orders.filter(function (o) { return o.bought && !o.shipPaid; }).length;
    var defs = [["all", "Все", orders.length]];
    STATUSES.forEach(function (s) { defs.push([s, s, orders.filter(function (o) { return o.status === s; }).length]); });
    defs.push(["debt", "Доставка не оплачена", debtN]);
    var box = $("chips");
    box.replaceChildren.apply(box, defs.map(function (d) {
      return el("button", { type: "button", class: "chip", "aria-pressed": String(filter === d[0]), onclick: function () { filter = d[0]; renderBar(); renderList(); } },
        d[1], el("span", { class: "n" }, String(d[2])));
    }));
  }
  function card(o) {
    var url = safeHref(o.link);
    var who = o.client.trim() ? (o.client.trim()[0] === "@" ? o.client.trim() : "@" + o.client.trim()) : "Без имени";
    var pillCls = o.status === WAIT ? "bad" : "info";
    var shipTxt = "Доставка: " + (o.shipPaid ? "Да" : "Нет") + (o.shipCost ? " (" + fmt(o.shipCost) + ")" : "");
    var meta = el("div", { class: "c-meta" },
      o.country ? el("span", { class: "country" }, o.country) : null,
      url ? el("a", { class: "link", href: url.href, target: "_blank", rel: "noopener noreferrer" }, url.hostname.replace(/^www\./, "") + " ↗")
          : el("span", { class: "nolink" }, o.link ? o.link : "ссылка не указана")
    );
    var track = o.track ? el("div", { class: "c-track" },
      el("code", null, o.track),
      el("button", { type: "button", class: "copy", onclick: function () {
        var p;
        try { p = navigator.clipboard.writeText(o.track); } catch (e) { p = Promise.reject(e); }
        p.then(function () { toast("Трек скопирован"); }, function () { toast("Не удалось скопировать, выдели трек вручную"); });
      } }, "Копировать")) : null;
    return el("article", { class: "card" },
      el("div", { class: "c-head" }, el("div", { class: "who" }, who), el("span", { class: "pill " + pillCls }, o.status)),
      meta, track,
      el("div", { class: "c-foot" },
        el("button", { type: "button", class: "tog " + (o.bought ? "on" : "off"), "aria-pressed": String(o.bought), onclick: function () { setBought(o, !o.bought); } }, "Выкупил: " + (o.bought ? "Да" : "Нет")),
        el("button", { type: "button", class: "tog " + (o.shipPaid ? "on" : ""), "aria-pressed": String(o.shipPaid), onclick: function () { patch(o, { shipPaid: !o.shipPaid }); } }, shipTxt),
        el("button", { type: "button", class: "edit", onclick: function () { openSheet(o); } }, "Изменить")
      )
    );
  }
  function renderList() {
    var list = $("list"), empty = $("empty"), note = $("note");
    if (!loaded) { list.replaceChildren(); empty.hidden = false; note.hidden = true; return; }
    var a = visible();
    list.replaceChildren.apply(list, a.map(card));
    if (!orders.length) {
      empty.hidden = false;
      empty.replaceChildren(el("strong", null, "Заказов пока нет"), "Нажми «Новый заказ» внизу и вставь ссылку на вещь и юзернейм клиента.");
    } else if (!a.length) {
      empty.hidden = false;
      empty.replaceChildren(el("strong", null, "Ничего не найдено"), "Смени фильтр или поиск.");
    } else empty.hidden = true;
    var waiting = orders.some(function (o) { return !o.bought; });
    note.hidden = !(waiting && a.length);
    note.textContent = "Сверху те, что ещё не выкуплены, самые старые первыми.";
  }
  function renderAll() { renderSummary(); renderBar(); renderList(); }

  /* ---------- changes ---------- */
  function patch(o, p) {
    if (!store) return;
    run(queued(o.id, function () { return store.update(o.id, p); })).catch(function () {});
  }
  function setBought(o, v) {
    patch(o, { bought: v, status: v ? (o.status === WAIT ? "Выкуплено" : o.status) : WAIT });
  }

  /* ---------- sheet ---------- */
  function setSeg(name, val) {
    F[name] = val;
    $("seg-" + name).querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String((b.dataset.v === "1") === val)); });
  }
  function openSheet(o) {
    F.id = o ? o.id : null;
    $("sheetTitle").textContent = o ? "Заказ" : "Новый заказ";
    $("fLink").value = o ? o.link : "";
    $("fClient").value = o ? o.client : "";
    $("fCountry").value = o && o.country ? o.country : (lsGet("sb_country") || COUNTRIES[0]);
    $("fStatus").value = o ? o.status : WAIT;
    $("fTrack").value = o ? o.track : "";
    $("fShipCost").value = o && o.shipCost !== null ? String(o.shipCost) : "";
    setSeg("bought", o ? o.bought : false);
    setSeg("shipPaid", o ? o.shipPaid : false);
    var del = $("delBtn");
    del.hidden = !o; del.classList.remove("armed"); del.textContent = "Удалить заказ";
    $("sheet").hidden = false;
    if (!o) setTimeout(function () { $("fLink").focus(); }, 30);
  }
  function closeSheet() { $("sheet").hidden = true; F.id = null; clearTimeout(delTimer); }

  function initSheet() {
    COUNTRIES.forEach(function (c) { $("fCountry").append(el("option", { value: c }, c)); });
    STATUSES.forEach(function (s) { $("fStatus").append(el("option", { value: s }, s)); });
    ["bought", "shipPaid"].forEach(function (name) {
      $("seg-" + name).addEventListener("click", function (e) {
        var b = e.target.closest("button"); if (!b) return;
        var v = b.dataset.v === "1";
        setSeg(name, v);
        if (name === "bought") {
          if (v && $("fStatus").value === WAIT) $("fStatus").value = "Выкуплено";
          if (!v) $("fStatus").value = WAIT;
        }
      });
    });
    $("fStatus").addEventListener("change", function () { setSeg("bought", $("fStatus").value !== WAIT); });
    $("cancelBtn").addEventListener("click", closeSheet);
    $("sheet").addEventListener("click", function (e) { if (e.target === $("sheet")) closeSheet(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
    $("delBtn").addEventListener("click", function () {
      var b = $("delBtn");
      if (!b.classList.contains("armed")) {
        b.classList.add("armed"); b.textContent = "Нажми ещё раз, чтобы удалить";
        clearTimeout(delTimer);
        delTimer = setTimeout(function () { b.classList.remove("armed"); b.textContent = "Удалить заказ"; }, 4000);
        return;
      }
      var id = F.id;
      run(queued(id, function () { return store.remove(id); })).then(closeSheet, function () {});
    });
    $("form").addEventListener("submit", function (e) {
      e.preventDefault();
      var client = $("fClient").value.trim();
      if (!client) { $("fClient").focus(); toast("Укажи юзернейм клиента"); return; }
      var data = {
        link: $("fLink").value.trim(),
        client: client,
        country: $("fCountry").value,
        status: $("fStatus").value,
        bought: F.bought,
        track: $("fTrack").value.trim(),
        shipPaid: F.shipPaid,
        shipCost: num($("fShipCost").value)
      };
      var btn = $("saveBtn"); btn.disabled = true;
      var p = F.id ? (function (id) { return queued(id, function () { return store.update(id, data); }); })(F.id)
                   : store.add(Object.assign({}, data, { createdAt: Date.now() }));
      run(Promise.resolve(p)).then(function () { lsSet("sb_country", data.country); closeSheet(); }, function () {}).then(function () { btn.disabled = false; });
    });
  }

  /* ---------- backup ---------- */
  function backupNote() {
    var t = Number(lsGet("sb_lastBackup") || 0), n = $("backupNote");
    n.textContent = "Заказы хранятся только в этом браузере. " + (t ? "Последняя копия: " + new Date(t).toLocaleDateString("ru-RU") + "." : "Копию ещё не сохраняли.");
  }
  function initBackup() {
    $("exportBtn").addEventListener("click", function () {
      var data = JSON.stringify({ app: "spendbuy-orders", v: 1, exportedAt: Date.now(), orders: orders }, null, 1);
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      a.download = "spendbuy-orders-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.append(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      lsSet("sb_lastBackup", String(Date.now())); backupNote(); toast("Копия сохранена");
    });
    $("importBtn").addEventListener("click", function () { $("importFile").click(); });
    $("importFile").addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0]; e.target.value = "";
      if (!f) return;
      if (f.size > 5e6) { toast("Файл слишком большой"); return; }
      f.text().then(function (txt) {
        var d = JSON.parse(txt);
        var list = Array.isArray(d) ? d : d && d.orders;
        if (!Array.isArray(list)) throw new Error("bad");
        var add = 0;
        list.forEach(function (o) {
          if (!o || typeof o !== "object") return;
          var id = String(o.id || "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
          var rec = norm(Object.assign({}, o, { id: id }));
          delete rec.id;
          if (orders.some(function (x) { return x.id === id; })) store.update(id, rec); else { store.addWithId(id, rec); add++; }
        });
        toast("Загружено заказов: " + list.length);
      }).catch(function () { toast("Не получилось прочитать файл копии"); });
    });
  }

  /* ---------- start ---------- */
  function onData(list, fromCache) {
    if (!loaded && fromCache && !list.length) return;
    loaded = true; clearTimeout(loadTimer);
    orders = list.map(norm);
    renderAll(); backupNote();
  }
  function onStoreError() {
    $("banner").hidden = false;
    $("banner").textContent = "Нет связи с хранилищем. Обнови страницу, чтобы увидеть свежие заказы.";
    toast("Потеряна связь с хранилищем");
  }
  async function start() {
    initSheet();
    renderAll();
    $("search").addEventListener("input", function (e) { query = e.target.value; renderList(); });
    $("tileWait").addEventListener("click", function () { filter = WAIT; renderBar(); renderList(); });
    $("tileDebt").addEventListener("click", function () { filter = "debt"; renderBar(); renderList(); });
    $("addBtn").addEventListener("click", function () { openSheet(null); });

    store = makeLocal();
    initBackup();
    loadTimer = setTimeout(function () { if (!loaded) { loaded = true; renderAll(); } }, 6000);
    store.subscribe(onData, onStoreError);
    $("addBtn").disabled = false;
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  start();
})();
</script>


</body></html>
